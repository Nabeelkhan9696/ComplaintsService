<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints Service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --panel: #111827;
            --accent: #38bdf8;
            --border: #1f2937;
            --text: #e5e7eb;
            --muted: #9ca3af;
            --success: #22c55e;
            --error: #ef4444;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: radial-gradient(circle at 20% 20%, rgba(56,189,248,0.08), transparent 25%),
                        radial-gradient(circle at 80% 0%, rgba(34,197,94,0.08), transparent 30%),
                        var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 32px;
            letter-spacing: -0.03em;
        }

        p.subtitle {
            margin: 0 0 28px;
            color: var(--muted);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.35);
        }

        form label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text);
        }

        form input,
        form textarea {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #0b1220;
            color: var(--text);
            transition: border 0.15s ease, box-shadow 0.15s ease;
        }

        form input:focus,
        form textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56,189,248,0.2);
        }

        textarea { min-height: 160px; resize: vertical; }

        .actions { display: flex; justify-content: flex-end; }

        button {
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(37,99,235,0.35);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        button:hover { transform: translateY(-1px); }
        button:active { transform: translateY(0); box-shadow: 0 8px 18px rgba(37,99,235,0.25); }

        .list {
            max-height: 520px;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            border: 1px solid var(--border);
            background: #0b1220;
            border-radius: 12px;
            padding: 16px;
        }

        .card-header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }

        .subject { font-weight: 700; font-size: 16px; }
        .meta { color: var(--muted); font-size: 12px; }
        .description { margin-top: 8px; line-height: 1.5; color: #cbd5e1; white-space: pre-line; }

        .message { margin-bottom: 16px; padding: 12px 14px; border-radius: 10px; font-weight: 600; }
        .message.success { background: rgba(34,197,94,0.12); color: #86efac; border: 1px solid rgba(34,197,94,0.25); }
        .message.error { background: rgba(239,68,68,0.12); color: #fecdd3; border: 1px solid rgba(239,68,68,0.3); }

        .error-text { color: #fca5a5; font-size: 13px; margin-top: -10px; margin-bottom: 14px; }

        @media (max-width: 960px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Complaints Service</h1>
    <p class="subtitle">Submit a complaint and track recent submissions in one place.</p>

    <div class="grid">
        <div class="panel">
            <h2>New complaint</h2>

            <div th:if="${message}" class="message success" th:text="${message}"></div>

            <form th:action="@{/complaints}" th:object="${complaint}" method="post" novalidate>
                <label for="name">Name</label>
                <input id="name" type="text" th:field="*{name}" placeholder="Ada Lovelace" required>
                <div class="error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>

                <label for="email">Email (optional)</label>
                <input id="email" type="email" th:field="*{email}" placeholder="ada@example.com">
                <div class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

                <label for="subject">Subject</label>
                <input id="subject" type="text" th:field="*{subject}" placeholder="Brief title" required>
                <div class="error-text" th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}"></div>

                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" placeholder="Describe the issue" required></textarea>
                <div class="error-text" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>

                <div class="actions">
                    <button type="submit">Submit complaint</button>
                </div>
            </form>
        </div>

        <div class="panel">
            <h2>Recent complaints</h2>
            <div class="list" th:if="${complaints}" th:unless="${#lists.isEmpty(complaints)}">
                <div class="card" th:each="c : ${complaints}">
                    <div class="card-header">
                        <div>
                            <div class="subject" th:text="${c.subject}"></div>
                            <div class="meta">
                                <span th:text="${c.name}"></span>
                                <span th:if="${c.email}"> · <span th:text="${c.email}"></span></span>
                            </div>
                        </div>
                        <div class="meta" th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd HH:mm')}"></div>
                    </div>
                    <div class="description" th:text="${c.description}"></div>
                </div>
            </div>
            <p class="meta" th:if="${#lists.isEmpty(complaints)}">No complaints yet.</p>
        </div>
    </div>
</div>
</body>
</html>
